<style>
/* Layout: logo + title + route, then one photo card per show, stacked like the teaser's date cards. */
:root {
  --ink: #050D0F;
  --line: #1F2B2D;
  --cream: #E5DCCE;
  --cream-dim: rgba(229, 220, 206, .66);
  --yellow: #FFEE00;
  --display: "Archivo Black", "Arial Black", "Helvetica Neue", Arial, sans-serif;
  --body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --poster: "Bebas Neue", "Arial Narrow", Impact, sans-serif;   /* condensed gig-poster face */
  --narrow: "Archivo Narrow", "Arial Narrow", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--ink); color: var(--cream); font-family: var(--body); font-size: 16px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--yellow); outline-offset: 3px; }
.wrap { width: 100%; max-width: 920px; margin-inline: auto; padding-inline: 16px; }

/* Flags (3:2, drawn inline) */
.flag { display: inline-block; width: 1.5em; height: 1em; flex: none; border-radius: 2px; overflow: hidden; box-shadow: 0 0 0 1px rgba(229,220,206,.25); vertical-align: -0.12em; }
.flag svg { display: block; width: 100%; height: 100%; }

/* HERO: the full scooter shot of Rammie & Nai (16:9, uncropped), title overlapping its lower part */
.hero { position: relative; isolation: isolate; }
.hero__photo {
  position: absolute; z-index: -1; top: 0; left: 50%; transform: translateX(-50%);
  width: min(100%, 1100px); aspect-ratio: 16 / 9;
  background: linear-gradient(180deg, rgba(5,13,15,0) 35%, rgba(5,13,15,.75) 72%, var(--ink) 100%), url("hero.jpg") center / cover no-repeat;
}
.hero .top { padding-top: calc(min(100vw, 1100px) * .5625 * .58); }
@media (min-width: 1101px) { .hero__photo { -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); } }
/* TOP */
.top { display: grid; justify-items: center; gap: 18px; text-align: center; padding-block: 44px 32px; }
.top__logo { width: min(520px, 92%); height: auto; }
.top h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(30px, 7vw, 56px); line-height: 1; letter-spacing: .02em; }
.jump { display: inline-flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 6px; padding: 6px 10px; color: var(--yellow); text-decoration: none; font-family: var(--narrow); font-weight: 700; font-size: clamp(16px, 3vw, 19px); letter-spacing: .28em; text-transform: uppercase; }
.jump__arrow { font-family: var(--body); font-size: 1.6em; line-height: 1; letter-spacing: 0; }
html { scroll-behavior: smooth; }
/* genres, cities and names drawn from Rammie Handwriting Messy outlines (inline SVG, no font download) */
.hw-phrase { display: inline-flex; align-items: center; }
.hw-gap { width: .28em; }
.hw { height: 1.25em; width: auto; fill: currentColor; overflow: visible; }  /* 1100-unit box, cap height 700 */
.route { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 16px; font-family: var(--poster); font-size: 19px; line-height: 1; letter-spacing: .06em; }
.route li { display: inline-flex; align-items: center; gap: 8px; }
.hw--bold path { stroke: currentColor; stroke-width: 30; stroke-linejoin: round; stroke-linecap: round; }   /* thicker pen for the top lines */

/* SHOWS */
.shows { list-style: none; margin: 0; padding: 0 0 40px; display: grid; gap: 14px; }
.show {
  position: relative; isolation: isolate; overflow: hidden; border-radius: 6px;
  min-height: clamp(220px, 34vw, 300px); display: flex; align-items: flex-end;
  background: var(--line);
}
.show__img { position: absolute; inset: 0; z-index: -2; width: 100%; height: 100%; object-fit: cover; }
.show::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(5,13,15,.05) 20%, rgba(5,13,15,.88) 100%); }
.show__body { width: 100%; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 20px; padding: 20px; }
.show__info { min-width: 0; display: grid; gap: 6px; }
.show__city { margin: 0; display: flex; align-items: center; gap: 12px; font-family: var(--display); font-weight: 400; font-size: clamp(32px, 7vw, 56px); line-height: 1; overflow-wrap: anywhere; }
.show__city .flag { font-size: clamp(18px, 3vw, 24px); }
.show__city .hw--bold path { stroke-width: 38; }   /* a touch heavier over photos */
.show__meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.show__date { font-family: var(--poster); color: var(--yellow); font-size: 32px; line-height: 1; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.show__venue { font-family: var(--narrow); font-weight: 700; font-size: 17px; letter-spacing: .14em; text-transform: uppercase; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; min-width: 140px; padding: 13px 18px;
  font-family: var(--display); font-size: 14px; letter-spacing: .1em; text-transform: uppercase; text-decoration: none;
  background: var(--yellow); color: var(--ink); border: 2px solid var(--yellow); border-radius: 3px;
  transition: background-color .15s ease, color .15s ease;
}
.btn:hover { background: transparent; color: var(--yellow); }
.btn--soon { background: rgba(5,13,15,.55); color: var(--cream-dim); border-color: rgba(229,220,206,.3); cursor: default; }
.btn--soon:hover { background: rgba(5,13,15,.55); color: var(--cream-dim); }
.btn--played { background: transparent; color: var(--cream-dim); border-color: transparent; cursor: default; min-width: 0; padding-inline: 0; }
.show.is-past .show__img { filter: grayscale(1) brightness(.6); }

.foot { display: flex; justify-content: center; padding-block: 8px 48px; }
.foot a { font-weight: 700; letter-spacing: .06em; text-decoration: none; color: var(--cream-dim); padding: 8px; }
.foot a:hover { color: var(--cream); }

@media (max-width: 560px) {
  .show__body { padding: 16px; }
  .btn { width: 100%; }
  .btn--played { width: auto; }
}
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>

  gr: { name: "Greece", svg: '<svg viewBox="0 0 27 18"><rect width="27" height="18" fill="#0D5EAF"/><path d="M0 3h27M0 7h27M0 11h27M0 15h27" stroke="#fff" stroke-width="2"/><rect width="10" height="10" fill="#0D5EAF"/><path d="M5 0v10M0 5h10" stroke="#fff" stroke-width="2"/></svg>' },
  pt: { name: "Portugal", svg: '<svg viewBox="0 0 30 20"><rect width="30" height="20" fill="#DA291C"/><rect width="12" height="20" fill="#046A38"/><circle cx="12" cy="10" r="4.3" fill="none" stroke="#FFE000" stroke-width="1.3"/><path d="M10.2 7.4h3.6v3.4a1.8 1.8 0 0 1-3.6 0z" fill="#fff" stroke="#DA291C" stroke-width=".9"/></svg>' },
  es: { name: "Spain", svg: '<svg viewBox="0 0 30 20"><rect width="30" height="20" fill="#AA151B"/><rect y="5" width="30" height="10" fill="#F1BF00"/></svg>' },
  be: { name: "Belgium", svg: '<svg viewBox="0 0 30 20"><rect width="10" height="20" fill="#000"/><rect x="10" width="10" height="20" fill="#FDDA24"/><rect x="20" width="10" height="20" fill="#EF3340"/></svg>' },
  sct: { name: "Scotland", svg: '<svg viewBox="0 0 30 20"><rect width="30" height="20" fill="#0065BD"/><path d="M0 0L30 20M30 0L0 20" stroke="#fff" stroke-width="3.2"/></svg>' },
};
const flag = code => `<span class="flag" role="img" aria-label="${FLAGS[code].name}">${FLAGS[code].svg}</span>`;

const MONTHS = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
const DAYS = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

const now = new Date();
const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

document.getElementById("route").innerHTML = SHOWS.map(s => `<li>${flag(s.flag)}${CITY_HW[s.city] || esc(s.city.toUpperCase())}</li>`).join("");

document.getElementById("shows").innerHTML = SHOWS.map(s => {
  const [y, m, d] = s.date.split("-").map(Number);
  const day = new Date(y, m - 1, d);
  const past = day < today;
  let cta;
  if (past) cta = `<span class="btn btn--played">Played</span>`;
  else if (s.tickets) cta = `<a class="btn" href="${esc(s.tickets)}" target="_blank" rel="noopener">Tickets</a>`;
  else cta = `<span class="btn btn--soon" aria-disabled="true">Tickets soon</span>`;
  return `<li class="show${past ? " is-past" : ""}">
    <img class="show__img" src="${esc(s.img)}" alt="" loading="lazy">
    <div class="show__body">
      <div class="show__info">
        <h2 class="show__city">${flag(s.flag)}${CITY_HW[s.city] || esc(s.city.toUpperCase())}</h2>
        <div class="show__meta">
          <span class="show__date">${DAYS[day.getDay()]} ${d} ${MONTHS[m - 1]}</span>
          <span class="show__venue">${esc(s.venue)}</span>
        </div>
      </div>
      ${cta}
    </div>
  </li>`;
}).join("");
</script>

</body>
</html>
